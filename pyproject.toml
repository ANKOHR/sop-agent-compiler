[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-agent-compiler"
version = "0.1.0"
description = "Deterministic grammar-based SOP compiler and simulator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sopc = "sopc.cli:main"

[tool.setuptools]
packages = ["sopc"]

[tool.setuptools.package-data]
sopc = ["fixtures/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
